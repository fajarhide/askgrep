[package]
name = "askgrep"
version = "0.1.0"
edition = "2021"
authors = ["fajarhide"]
description = "grep for questions you cannot write as a pattern. Reads every function, not a sample."
license = "Apache-2.0"
repository = "https://github.com/fajarhide/askgrep"
keywords = ["grep", "search", "cli", "code-search", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"          # gitignore-aware walk, same crate ripgrep uses
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
